name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build YCopyPaste.app (universal)
        run: ./scripts/build-app.sh --universal

      - name: Zip
        run: ditto -c -k --keepParent build/YCopyPaste.app build/YCopyPaste.zip

      - uses: actions/upload-artifact@v4
        with:
          name: YCopyPaste
          path: build/YCopyPaste.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/YCopyPaste.zip
